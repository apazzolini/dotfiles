# remap prefix to Control + p
unbind C-b
set -g prefix C-p
bind C-p send-prefix

# basic setup
set -g default-terminal "tmux-256color"
set -sa terminal-features ',xterm-256color:RGB'
set -g base-index 0
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g automatic-rename off
set -g status-position top
set -g status-interval 0
set -g focus-events on
set -s escape-time 20
set -g default-command $SHELL
set -g history-limit 50000
setw -g mouse on
setw -g mode-keys vi

# Opencode clipboard issue
set -g allow-passthrough on

# pi
set -g extended-keys on
set -g extended-keys-format csi-u

# copy mode bindings
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe 'pbcopy'
bind-key -T copy-mode-vi Y send-keys -X copy-pipe 'pbcopy'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Space send-keys -N 10 -X cursor-down
bind-key -T copy-mode-vi BSpace send-keys -N 10 -X cursor-up
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi H send-keys -X start-of-line
bind-key -T copy-mode-vi L send-keys -X end-of-line
bind-key -T copy-mode-vi V send-keys -X select-line

bind -T copy-mode-vi i switch-client -T copyModeMultiKey_i
bind -T copyModeMultiKey_i w send-keys -X select-word
# bind -T copyModeMultiKey_i W send-keys -X clear-selection \; send-keys -X previous-space \; send-keys -X begin-selection \; send-keys -X next-space-end
bind -T copyModeMultiKey_i W set-option -F @saved-word-separators '#{word-separators}' \; set-option word-separators '' \; send-keys -X select-word \; set-option -F word-separators '#{@saved-word-separators}' \; set-option -u @saved-word-separators

bind -T copyModeMultiKey_i b send-keys -X clear-selection \; send-keys -X jump-to-backward '(' \; send-keys -X begin-selection \; send-keys -X jump-to-forward ')'
bind -T copyModeMultiKey_i ( send-keys -X clear-selection \; send-keys -X jump-to-backward '(' \; send-keys -X begin-selection \; send-keys -X jump-to-forward ')'
bind -T copyModeMultiKey_i ) send-keys -X clear-selection \; send-keys -X jump-to-backward '(' \; send-keys -X begin-selection \; send-keys -X jump-to-forward ')'
bind -T copyModeMultiKey_i B send-keys -X clear-selection \; send-keys -X jump-to-backward '{' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '}'
bind -T copyModeMultiKey_i \{ send-keys -X clear-selection \; send-keys -X jump-to-backward '{' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '}'
bind -T copyModeMultiKey_i \} send-keys -X clear-selection \; send-keys -X jump-to-backward '{' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '}'
bind -T copyModeMultiKey_i [ send-keys -X clear-selection \; send-keys -X jump-to-backward '[' \; send-keys -X begin-selection \; send-keys -X jump-to-forward ']'
bind -T copyModeMultiKey_i ] send-keys -X clear-selection \; send-keys -X jump-to-backward '[' \; send-keys -X begin-selection \; send-keys -X jump-to-forward ']'
bind -T copyModeMultiKey_i < send-keys -X clear-selection \; send-keys -X jump-to-backward '<' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '>'
bind -T copyModeMultiKey_i > send-keys -X clear-selection \; send-keys -X jump-to-backward '<' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '>'
bind -T copyModeMultiKey_i ` send-keys -X clear-selection \; send-keys -X jump-to-backward '`' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '`'
bind -T copyModeMultiKey_i \' send-keys -X clear-selection \; send-keys -X jump-to-backward "'" \; send-keys -X begin-selection \; send-keys -X jump-to-forward "'"
bind -T copyModeMultiKey_i \" send-keys -X clear-selection \; send-keys -X jump-to-backward '"' \; send-keys -X begin-selection \; send-keys -X jump-to-forward '"'
bind -T copyModeMultiKey_i l send-keys -X clear-selection \; send-keys -X back-to-indentation \; send-keys -X begin-selection \; send-keys -X end-of-line \; send-keys -X other-end

set -g @jump-key 'space'
set -g @jump-bg-color '\e[0m\e[38;5;246m'
run-shell ~/.tmux-jump/tmux-jump.tmux

bind-key -n C-g if-shell -F '#{m/r:^__lazygit_,#{session_name}}' \
  'if-shell -F "#{==:#{@lazygit-editor-pane},1}" "run-shell \"~/.dotfiles/bin/lazygit-popup-edit --focus-lazygit #{pane_id}\"" "detach-client"' \
  'set-environment -F LAZYGIT_POPUP_OWNER_NAME "#{session_name}" ; set-environment -F LAZYGIT_POPUP_SOURCE_PANE "#{pane_id}" ; display-popup -E -b rounded -S fg=cyan -x C -y C -w 100% -h 100% -d "#{pane_current_path}" ~/.dotfiles/bin/tmux-lazygit-popup'

bind 1 select-pane -t 1 \; resize-pane -Z
bind 2 select-pane -t 2 \; resize-pane -Z
bind 3 select-layout even-vertical \; resize-pane -t 2 -y 20
bind 4 select-layout even-horizontal
bind 5 select-layout tiled
bind C-p switch-client -l
# bind p run-shell "tmux neww ~/.dotfiles/bin/tmux-sessionizer"
bind p display-popup -B -E -x 0 -y 0 -h "100%" -w "100%" "~/.dotfiles/bin/tmux-sessionizer"
# bind 9 switch-client -p
bind 9 select-layout even-vertical \; resize-pane -t 3 -y 5 \; resize-pane -t 1 -y 50
bind 0 switch-client -n
bind n command-prompt -p 'Session note: ' \
  'set-option @note "%%%"; if-shell -F "#{==:#{@note},}" "set-option -qu @note"'
bind N next-window
bind P previous-window

bind -n -r M-Up resize-pane -U 5
bind -n -r M-Down resize-pane -D 5
bind -n -r M-Left resize-pane -L 5
bind -n -r M-Right resize-pane -R 5

# convenience bindings
bind j join-pane
bind g choose-tree -s \
  -f '#{!:#{m/r:^__lazygit_,#{session_name}}}' \
  -F '#{?pane_format,#{?pane_marked,#[reverse],}#{?pane_floating_flag,#[italics],}#{pane_current_command}#{pane_flags}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{?@note,#{@note},}#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind S-Left swap-window -t -1
bind S-Right swap-window -t +1
bind x if-shell -F "#{@pane-is-vim}" "send-keys :tabclose \; send-keys Enter" "kill-pane"
bind , command-prompt -p (rename-window) "rename-window '%%'"
bind C-l if-shell -F '#{==:#{pane_current_command},pi}' \
  'send-keys C-l' \
  'if-shell -F "#{@pane-is-vim}" "send-keys M-l" "send-keys -R \; send-keys C-l \; clear-history \; send-keys"'

set -g status-style bg=colour244,fg=colour247
# set -g status-left-length 28
# set -g status-left "#[fg=green][ #h ] #[fg=yellow][ #S ] "
set -g status-left-length 40
set -g status-left "#[fg=yellow][ #S ] "
set -g window-status-current-style bg=colour245,fg=white
set -g window-status-format " #I:#W (#{window_panes}) "
set -g window-status-current-format " #I:#W (#{window_panes}) "
set -g status-right ""
set -g status-right " #[fg=yellow][ #T ]"

set -g pane-border-style fg=colour241,bg=colour244
set -g pane-active-border-style fg=colour14
set -g window-style bg=colour244
set -g window-active-style bg=terminal
set -g mode-style bg=colour245,fg=red


bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'
# bind-key -n C-h if -F '#{@pane-is-vim}' 'send-keys C-h' "if -F '#{pane_at_left}'   'run-shell \"hyprctl dispatch movefocus l > /dev/null 2>&1\"' 'select-pane -L'"
# bind-key -n C-j if -F '#{@pane-is-vim}' 'send-keys C-j' "if -F '#{pane_at_bottom}' 'run-shell \"hyprctl dispatch movefocus d > /dev/null 2>&1\"' 'select-pane -D'"
# bind-key -n C-k if -F '#{@pane-is-vim}' 'send-keys C-k' "if -F '#{pane_at_top}'    'run-shell \"hyprctl dispatch movefocus u > /dev/null 2>&1\"' 'select-pane -U'"
# bind-key -n C-l if -F '#{@pane-is-vim}' 'send-keys C-l' "if -F '#{pane_at_right}'  'run-shell \"hyprctl dispatch movefocus r > /dev/null 2>&1\"' 'select-pane -R'"

bind-key -n C-Left if -F "#{@pane-is-vim}" 'send-keys C-Left' 'resize-pane -L 3'
bind-key -n C-Down if -F "#{@pane-is-vim}" 'send-keys C-Down' 'resize-pane -D 3'
bind-key -n C-Up if -F "#{@pane-is-vim}" 'send-keys C-Up' 'resize-pane -U 3'
bind-key -n C-Right if -F "#{@pane-is-vim}" 'send-keys C-Right' 'resize-pane -R 3'

bind-key O if-shell -F '#{==:#{session_name},popup-session}' \
    'detach-client' \
    'display-popup -w 90% -h 90% -E "tmux new-session -A -s popup-session"'

# ssh nesting
bind -n S-down \
	set -qg status-bg colour245 \; \
	unbind -n C-h \; \
	unbind -n C-j \; \
	unbind -n C-k \; \
	unbind -n C-l \; \
	set -qg prefix C-b
bind -n S-up \
	set -qg status-bg colour244 \; \
  bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L' \; \
  bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D' \; \
  bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U' \; \
  bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R' \; \
	set -qg prefix C-p
