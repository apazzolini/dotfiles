command_timeout = 1000
add_newline = false

format = """${custom.hertzner}$directory$git_branch$git_status$git_state[»](purple) """
# format = """${custom.hertzner}$directory[»](purple) """
right_format = """$time"""

[custom.hertzner]
command = 'echo "[drevps]"'
when = 'test `hostname` = "drevps"'

[directory]
truncation_length = 1000
truncate_to_repo = false

[git_branch]
format = "[<$branch>]($style) "
style = "yellow"

[git_status]
# disabled = true
ahead = "↑${count}"
diverged = "↑${ahead_count}↓${behind_count}"
behind = "↓${count} "
stashed = ""
deleted = '✘ '
use_git_executable = true

[time]
disabled = false
style = 'gray'
format = '\[[$time]($style)\]'
