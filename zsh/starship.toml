add_newline = false

format = """${custom.hertzner}$directory$git_branch$git_status$git_state[»](purple) """
right_format = """${custom.archm}${custom.archw}$time"""

[custom.hertzner]
command = 'echo "[drevps]"'
when = 'test `hostname` = "drevps"'

[custom.archm]
command = 'echo "archm"'
when = 'test `hostname` = "archm"'
style = 'gray'

[custom.archw]
command = 'echo "archw"'
when = 'test `hostname` = "archw"'
style = 'gray'

[directory]
truncation_length = 1000
truncate_to_repo = false

[git_branch]
format = "[<$branch>]($style) "
style = "yellow"

[git_status]
ahead = "↑${count}"
diverged = "↑${ahead_count}↓${behind_count}"
behind = "↓${count} "
stashed = ""
deleted = '✘ '

[time]
disabled = false
style = 'gray'
format = '\[[$time]($style)\]'
